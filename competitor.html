<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>경쟁기관 동향 모니터링</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', -apple-system, sans-serif;
      background: #f0f4f8;
      color: #1e293b;
      min-height: 100vh;
    }

    /* ── 상단 헤더 ── */
    header {
      background: #fff;
      border-bottom: 2px solid #e2e8f0;
      padding: 0 28px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-logo {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .header-title { font-size: 15px; font-weight: 700; color: #1e293b; }
    .header-sub   { font-size: 11px; color: #94a3b8; margin-top: 1px; }
    .header-nav   { display: flex; gap: 6px; }
    .nav-btn {
      padding: 6px 14px;
      border-radius: 7px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      color: #64748b;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s;
    }
    .nav-btn:hover  { background: #eff6ff; border-color: #bfdbfe; color: #3b82f6; }
    .nav-btn.active { background: #eff6ff; border-color: #3b82f6; color: #3b82f6; font-weight: 700; }

    /* ── 메인 레이아웃 ── */
    .layout {
      display: flex;
      min-height: calc(100vh - 56px);
    }

    /* ── 사이드바 ── */
    aside {
      width: 230px;
      background: #fff;
      border-right: 1px solid #e2e8f0;
      padding: 20px 12px;
      flex-shrink: 0;
      overflow-y: auto;
    }
    .side-section-title {
      font-size: 10px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 0 8px;
      margin-bottom: 8px;
      margin-top: 16px;
    }
    .side-section-title:first-child { margin-top: 0; }

    .category-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      color: #475569;
      text-align: left;
      transition: all 0.15s;
      margin-bottom: 2px;
    }
    .category-btn:hover  { background: #f1f5f9; color: #1e293b; }
    .category-btn.active { background: #eff6ff; color: #3b82f6; font-weight: 700; }
    .category-btn .cat-icon { font-size: 15px; flex-shrink: 0; }
    .category-btn .cat-label { flex: 1; }
    .category-btn .cat-count {
      font-size: 10px;
      background: #e2e8f0;
      color: #64748b;
      border-radius: 10px;
      padding: 1px 6px;
      font-weight: 700;
    }
    .category-btn.active .cat-count { background: #bfdbfe; color: #3b82f6; }

    /* ── 본문 ── */
    main {
      flex: 1;
      padding: 24px 28px;
      overflow-y: auto;
    }

    /* ── 컨트롤 바 ── */
    .control-bar {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .control-bar h2 { font-size: 15px; font-weight: 700; color: #1e293b; flex: 1; }
    .fetch-btn {
      padding: 9px 20px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .fetch-btn:hover    { opacity: 0.88; }
    .fetch-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .status-badge {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }
    .status-badge.idle    { background: #f1f5f9; color: #94a3b8; }
    .status-badge.loading { background: #fef9c3; color: #92400e; }
    .status-badge.done    { background: #dcfce7; color: #166534; }
    .status-badge.error   { background: #fee2e2; color: #991b1b; }

    /* ── 진행 바 ── */
    .progress-wrap {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 18px;
      display: none;
    }
    .progress-wrap.show { display: block; }
    .progress-label { font-size: 12px; color: #64748b; margin-bottom: 8px; }
    .progress-bar-bg {
      background: #e2e8f0;
      border-radius: 999px;
      height: 8px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #6366f1);
      border-radius: 999px;
      transition: width 0.4s ease;
      width: 0%;
    }

    /* ── 기관 카드 그리드 ── */
    .org-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .org-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      overflow: hidden;
      transition: box-shadow 0.15s;
    }
    .org-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }

    .org-card-header {
      padding: 13px 16px;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f8fafc;
    }
    .org-avatar {
      width: 36px; height: 36px;
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .org-name   { font-size: 14px; font-weight: 700; color: #1e293b; }
    .org-type   { font-size: 11px; color: #94a3b8; margin-top: 1px; }
    .org-badge  {
      margin-left: auto;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .badge-corp    { background: #eff6ff; color: #3b82f6; }
    .badge-univ    { background: #faf5ff; color: #7c3aed; }
    .badge-edu     { background: #f0fdf4; color: #16a34a; }

    .org-card-body { padding: 12px 16px; }
    .news-item {
      padding: 10px 0;
      border-bottom: 1px solid #f1f5f9;
    }
    .news-item:last-child { border-bottom: none; }
    .news-item a {
      font-size: 13px;
      color: #334155;
      text-decoration: none;
      line-height: 1.55;
      display: block;
      margin-bottom: 4px;
    }
    .news-item a:hover { color: #3b82f6; text-decoration: underline; }
    .news-meta {
      font-size: 11px;
      color: #94a3b8;
      display: flex;
      gap: 8px;
    }
    .news-empty {
      font-size: 12px;
      color: #cbd5e1;
      padding: 16px 0;
      text-align: center;
    }
    .news-count-badge {
      display: inline-block;
      font-size: 10px;
      background: #eff6ff;
      color: #3b82f6;
      border-radius: 10px;
      padding: 1px 7px;
      font-weight: 700;
      margin-left: 6px;
    }

    /* ── 빈 상태 ── */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: #94a3b8;
    }
    .empty-state .empty-icon { font-size: 52px; margin-bottom: 16px; }
    .empty-state .empty-title { font-size: 16px; font-weight: 600; color: #64748b; margin-bottom: 6px; }
    .empty-state .empty-sub   { font-size: 13px; color: #94a3b8; }

    /* ── 요약 바 ── */
    .summary-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .summary-chip {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 12px;
      color: #475569;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .summary-chip strong { color: #1e293b; font-size: 14px; }

    @media (max-width: 700px) {
      aside { display: none; }
      main  { padding: 16px; }
      .org-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

      </div>

  </main>
</div>

  { id:"kovjob",      name:"한국직업전문학교",        type:"corp", icon:"🏫", label:"대형 훈련기관" },
  { id:"bitcamp",     name:"비트캠프",               type:"corp", icon:"💾", label:"대형 훈련기관" },
  { id:"itbank",      name:"아이티뱅크",             type:"corp", icon:"🏦", label:"대형 훈련기관" },
  { id:"ssangyong",   name:"쌍용교육센터",           type:"corp", icon:"🐉", label:"대형 훈련기관" },
  { id:"kookbi",      name:"국비닷컴",              type:"corp", icon:"🌐", label:"대형 훈련기관" },

  // 🎓 대학·공공기관
  { id:"polytech",    name:"한국폴리텍대학",         type:"univ", icon:"🏛️", label:"대학·공공기관" },
  { id:"ssafy",       name:"SSAFY(삼성청년SW)",      type:"univ", icon:"💙", label:"대학·공공기관" },
  { id:"samsungaxi",  name:"삼성AXI",               type:"univ", icon:"⬛", label:"대학·공공기관" },
  { id:"multicampus", name:"멀티캠퍼스",             type:"univ", icon:"🎯", label:"대학·공공기관" },

  // 💻 에듀테크
  { id:"fastcampus",  name:"패스트캠퍼스",           type:"edu",  icon:"⚡", label:"에듀테크" },
  { id:"codestates",  name:"코드스테이츠",           type:"edu",  icon:"🟩", label:"에듀테크" },
  { id:"elice",       name:"엘리스",                type:"edu",  icon:"🐇", label:"에듀테크" },
  { id:"modulabs",    name:"모두의연구소",           type:"edu",  icon:"🔬", label:"에듀테크" },
  { id:"codeit",      name:"코드잇",                type:"edu",  icon:"💡", label:"에듀테크" },
  { id:"hitecher",    name:"하이테커",               type:"edu",  icon:"🚀", label:"에듀테크" },
  { id:"teamspartа",  name:"팀스파르타",             type:"edu",  icon:"⚔️", label:"에듀테크" },
  { id:"alpaco",      name:"알파코",                type:"edu",  icon:"🤖", label:"에듀테크" },
  { id:"elice2",      name:"엘리스그룹",             type:"edu",  icon:"🐰", label:"에듀테크" },
  { id:"zerobase",    name:"제로베이스",             type:"edu",  icon:"0️⃣", label:"에듀테크" },
  { id:"innovation",  name:"이노베이션아카데미",     type:"edu",  icon:"💎", label:"에듀테크" },
  { id:"wooa",        name:"우아한테크코스",         type:"edu",  icon:"🍕", label:"에듀테크" },
  { id:"hanghe",      name:"항해99",                type:"edu",  icon:"⚓", label:"에듀테크" },
  { id:"boostcamp",   name:"부스트캠프",             type:"edu",  icon:"🏕️", label:"에듀테크" },
];

const BADGE = { corp:"badge-corp", univ:"badge-univ", edu:"badge-edu" };
const BADGE_LABEL = { corp:"대형 훈련기관", univ:"대학·공공기관", edu:"에듀테크" };

let allResults = {};   // { orgId: [{title, link, pubDate, description}] }
let currentCat = "all";

/* ── 날짜 파싱 ── */
function parseDate(str) {
  try { return new Date(str); } catch(_) { return new Date(0); }
}
function fmt(str) {
  const d = parseDate(str);
  if (!d || d.getTime() === 0) return "-";
  return d.toLocaleDateString("ko-KR", { month:"short", day:"numeric" });
}

/* ── 7일 이내 필터 ── */
function isRecent(pubDate) {
  const d = parseDate(pubDate);
  if (!d || d.getTime() === 0) return true;
  return (Date.now() - d.getTime()) < 7 * 24 * 60 * 60 * 1000;
}

/* ── 단일 기관 뉴스 fetch ── */
async function fetchOrg(org) {
  try {
    const res = await fetch(`/api/news?q=${encodeURIComponent(org.name)}&display=10`);
    if (!res.ok) return [];
    const data = await res.json();
    const items = (data.items || [])
      .filter(it => isRecent(it.pubDate))
      .slice(0, 5)
      .map(it => ({
        title: it.title.replace(/<[^>]+>/g, ""),
        link:  it.link  || it.originallink,
        pub:   fmt(it.pubDate),
        desc:  (it.description || "").replace(/<[^>]+>/g, "").slice(0, 80),
      }));
    return items;
  } catch(_) {
    return [];
  }
}

/* ── 전체 수집 ── */
async function fetchAll() {
  const btn = document.getElementById("fetch-btn");
  const badge = document.getElementById("status-badge");
  const wrap = document.getElementById("progress-wrap");
  const fill = document.getElementById("progress-fill");
  const label = document.getElementById("progress-label");

  btn.disabled = true;
  badge.className = "status-badge loading";
  badge.textContent = "수집 중...";
  wrap.classList.add("show");
  document.getElementById("summary-bar").style.display = "none";
  allResults = {};

  const total = ORGS.length;
  let done = 0;
  let totalArticles = 0;

  for (const org of ORGS) {
    label.textContent = `🔍 ${org.name} 수집 중... (${done + 1}/${total})`;
    fill.style.width = (done / total * 100) + "%";

    const items = await fetchOrg(org);
    allResults[org.id] = items;
    totalArticles += items.length;
    done++;

    // 300ms 간격으로 API 부하 방지
    await new Promise(r => setTimeout(r, 300));
  }

  fill.style.width = "100%";
  label.textContent = `✅ 수집 완료 — ${total}개 기관 / ${totalArticles}건 기사`;

  badge.className = "status-badge done";
  badge.textContent = "수집 완료";
  btn.disabled = false;

  // 요약 바
  document.getElementById("s-total").textContent = totalArticles;
  document.getElementById("s-orgs").textContent = total;
  document.getElementById("s-date").textContent =
    new Date().toLocaleDateString("ko-KR", { month:"long", day:"numeric" }) + " 기준";
  document.getElementById("summary-bar").style.display = "flex";

  updateCounts();
  renderGrid(currentCat);
  renderSideNav();

  setTimeout(() => { wrap.classList.remove("show"); }, 3000);
}

/* ── 카운트 업데이트 ── */
function updateCounts() {
  const cats = ["all","corp","univ","edu"];
  cats.forEach(cat => {
    const orgs = cat === "all" ? ORGS : ORGS.filter(o => o.type === cat);
    const count = orgs.reduce((acc, o) => acc + (allResults[o.id] || []).length, 0);
    const el = document.getElementById("cnt-" + cat);
    if (el) el.textContent = count;
  });
}

/* ── 사이드 기관 목록 ── */
function renderSideNav() {
  const nav = document.getElementById("org-list-nav");
  nav.innerHTML = ORGS.map(org => {
    const cnt = (allResults[org.id] || []).length;
    return `
      <button class="category-btn" onclick="scrollToOrg('${org.id}')">
        <span class="cat-icon">${org.icon}</span>
        <span class="cat-label" style="font-size:12px;">${org.name}</span>
        ${cnt > 0 ? `<span class="cat-count">${cnt}</span>` : ""}
      </button>`;
  }).join("");
}

/* ── 카테고리 필터 ── */
function filterCategory(cat) {
  currentCat = cat;
  document.querySelectorAll(".category-btn[onclick^='filterCategory']").forEach(btn => {
    btn.classList.toggle("active", btn.getAttribute("onclick").includes(`'${cat}'`));
  });
  renderGrid(cat);
}

/* ── 해당 기관으로 스크롤 ── */
function scrollToOrg(id) {
  const el = document.getElementById("org-" + id);
  if (el) el.scrollIntoView({ behavior:"smooth", block:"center" });
}

/* ── 그리드 렌더 ── */
function renderGrid(cat) {
  const grid = document.getElementById("org-grid");
  const orgs = cat === "all" ? ORGS : ORGS.filter(o => o.type === cat);

  if (Object.keys(allResults).length === 0) {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <div class="empty-icon">🏛️</div>
        <div class="empty-title">경쟁기관 동향을 수집해보세요</div>
        <div class="empty-sub">상단 "전체 수집" 버튼을 누르면<br>31개 기관의 최신 뉴스를 자동으로 불러옵니다</div>
      </div>`;
    return;
  }

  grid.innerHTML = orgs.map(org => {
    const items = allResults[org.id] || [];
    const newsHtml = items.length === 0
      ? `<div class="news-empty">최근 7일 내 기사 없음</div>`
      : items.map(it => `
          <div class="news-item">
            <a href="${it.link}" target="_blank" rel="noopener">${it.title}</a>
            <div class="news-meta">
              <span>📅 ${it.pub}</span>
              ${it.desc ? `<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px;">${it.desc}</span>` : ""}
            </div>
          </div>`).join("");

    return `
      <div class="org-card" id="org-${org.id}">
        <div class="org-card-header">
          <div class="org-avatar" style="background:${avatarBg(org.type)}">${org.icon}</div>
          <div>
            <div class="org-name">${org.name}</div>
            <div class="org-type">${org.label}</div>
          </div>
          <span class="org-badge ${BADGE[org.type]}">${BADGE_LABEL[org.type]}</span>
        </div>
        <div class="org-card-body">
          <div style="font-size:12px;color:#64748b;margin-bottom:8px;">
            최근 7일 기사
            <span class="news-count-badge">${items.length}건</span>
          </div>
          ${newsHtml}
        </div>
      </div>`;
  }).join("");
}

function avatarBg(type) {
  return type === "corp" ? "#eff6ff"
       : type === "univ" ? "#faf5ff"
       : "#f0fdf4";
}

/* ── 초기 렌더 ── */
renderGrid("all");
updateCounts();
</script>
</body>
</html>
